  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

<body><main class="app-shell"><header class="hero"><div class="hero-badge">⏰ 시간 탐험대 <span class="version">v0.4.1</span></div><h1>시간을 바꿔 보자!</h1><p>60분을 묶고, 1시간을 풀면서 시간과 분을 익혀요.</p></header><section class="toolbar" aria-label="난이도 선택"><button type="button" class="diff-btn active" data-diff="1">🌱 쉬움</button><button type="button" class="diff-btn" data-diff="2">🌿 보통</button><button type="button" class="diff-btn" data-diff="3">🌳 도전</button></section><section class="game" aria-label="시간 계산 게임"><div class="topline"><div class="status"><div class="score">⭐ <span id="scoreText">0</span></div><div class="streak">🔥 <span id="streakText">0</span>연속</div></div><div class="mode-pill" id="typePill">문제 준비 중</div></div><section class="question"><div class="eyebrow" id="questionEyebrow">문제를 준비하고 있어요.</div><div class="big" id="questionBig">...</div><div class="ask" id="questionAsk"></div></section><div id="minutesGame" hidden><p class="helper">먼저 <b>60분씩 묶어</b> 보세요.</p><div class="minute-board"><div class="source-number"><span id="sourceMinutes"></span><small>에서</small></div><div class="bundle-area"><div class="bundle-list" id="bundleList"></div><div class="remainder-card"><span id="remainderValue">0분</span><small>남은 분</small></div></div><div class="bundle-actions"><button type="button" class="bundle-btn" id="bundleBtn">➕ 60분 묶기</button><button type="button" class="undo-btn" id="undoBtn">↩ 하나 풀기</button></div></div><div id="timeAnswerStep" hidden><div class="sum-hint">그래서 몇 시간 몇 분일까요?</div><div class="answer-pickers"><div><strong>시간</strong><div class="picker-row" id="hourChoices"></div></div><div><strong>분</strong><div class="picker-row" id="minuteChoices"></div></div></div></div></div><div id="timeGame" hidden><p class="helper">먼저 <b>1시간씩 60분으로 풀어</b> 보세요.</p><div class="unpack-board"><div class="time-source" id="timeSource"></div><div class="unpack-arrow">↓</div><div class="time-visual" id="timeVisual"></div><div class="bundle-actions"><button type="button" class="bundle-btn" id="unpackBtn">🧩 1시간 풀기</button><button type="button" class="undo-btn" id="packBackBtn">↩ 되돌리기</button></div></div><div class="sum-hint" id="sumHint" hidden></div><div class="answer-choice" id="answerChoices" hidden></div></div><div class="message" id="message" aria-live="polite">문제를 준비하고 있어요.</div><div class="answer-box" id="answerBox" aria-live="polite" hidden><div class="answer" id="answerText"></div><div class="formula" id="formulaText"></div></div><div class="actions"><button type="button" class="btn btn-secondary" id="resetBtn">↩ 처음부터</button><button type="button" class="btn btn-primary" id="checkBtn" hidden>정답 확인</button><button type="button" class="btn btn-primary" id="nextBtn" hidden>다음 문제 →</button></div></section></main><script src="./app.js?v=0.4.0"></script></body></html>
